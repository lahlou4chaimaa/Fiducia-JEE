<!DOCTYPE html>
<html class="dark" lang="fr">
<head>
    <meta charset="utf-8"/>
    <title>Espace Directeur - Propositions de Jury - Fiducia</title>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Manrope:wght@200..800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e9c176",
                        "on-primary": "#412d00",
                        "background": "#041329",
                        "surface-container-low": "#0d1c32",
                        "surface-container-high": "#1c2a41",
                        "outline": "#8f9097",
                        "error": "#ffb4ab"
                    },
                    fontFamily: {
                        "serif": ["Newsreader", "serif"],
                        "body": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #041329;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            background-attachment: fixed;
            font-family: 'Manrope', sans-serif;
        }
        .serif-display { font-family: 'Newsreader', serif; }
        .glass-card { background: rgba(17, 32, 54, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="text-on-surface text-white">

<nav class="fixed top-0 w-full z-50 bg-[#041329]/80 border-b border-white/10 backdrop-blur-md flex justify-between items-center px-6 h-16">
    <div class="flex items-center gap-4">
        <span class="serif-display text-xl tracking-tight text-primary font-bold italic">Fiducia</span>
    </div>
</nav>

<!-- Sidebar identique au Dashboard -->
<aside class="fixed left-0 top-16 h-[calc(100vh-64px)] w-64 z-40 bg-[#010e24] flex flex-col py-8 border-r border-white/5 hidden md:flex">
    <nav class="flex-1">
        <ul class="space-y-1">
            <li>
                <a class="flex items-center gap-4 py-3 px-6 border-l-4 border-transparent text-slate-400 hover:bg-white/5 hover:text-white text-sm tracking-wide uppercase transition-all" href="/directeur/dashboard">
                    <span class="material-symbols-outlined">folder_shared</span> Candidatures
                </a>
            </li>
            <li>
                <a class="flex items-center gap-4 py-3 px-6 border-l-4 border-primary bg-white/5 text-primary font-bold text-sm tracking-wide uppercase" href="/directeur/soutenances">
                    <span class="material-symbols-outlined">gavel</span> Jurys Soutenance
                </a>
            </li>
        </ul>
    </nav>

    <div class="px-4 pt-4 border-t border-white/5 space-y-4">
        <div class="flex items-center gap-2">
            <a href="/profile" class="flex-1 flex items-center gap-3 p-2 rounded-xl bg-[#112036] border border-white/5 hover:bg-[#2c3951] transition-all group">
                <div class="h-8 w-8 rounded-full bg-primary/20 flex items-center justify-center border border-primary/30">
                    <span class="material-symbols-outlined text-primary text-sm">person</span>
                </div>
                <div class="flex flex-col min-w-0">
                    <span id="sidebar-user-name" class="text-[11px] font-bold truncate">Mon Profil</span>
                    <span class="text-[9px] text-slate-500 uppercase tracking-tighter">Directeur</span>
                </div>
            </a>

            <button onclick="logout()" class="p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 hover:bg-red-500 hover:text-white transition-all group" title="Déconnexion">
                <span class="material-symbols-outlined text-sm">logout</span>
            </button>
        </div>
    </div>
</aside>

<!-- Contenu Principal réarchitecturé -->
<main class="md:ml-64 pt-24 px-6 pb-12 lg:px-12">
    <div class="max-w-7xl mx-auto">
        <header class="mb-12 relative">
            <div class="absolute -top-12 -left-12 w-64 h-64 bg-primary/10 rounded-full blur-[80px] pointer-events-none"></div>
            <div class="flex justify-between items-end relative z-10">
                <div>
                    <h1 class="serif-display text-5xl font-extrabold text-primary tracking-tight mb-2">Propositions de Jury</h1>
                    <p class="text-outline max-w-2xl text-lg italic">Définissez et transmettez la composition des jurys pour vos doctorants en fin de cycle.</p>
                </div>
                <div id="count-badge" class="px-4 py-2 bg-primary/10 border border-primary/20 rounded-full text-primary text-[10px] uppercase font-black tracking-widest">
                    0 Demande(s)
                </div>
            </div>
        </header>

        <!-- Conteneur de demandes de soutenances alimenté par JS -->
        <div id="soutenances-container" class="space-y-6">
            <div class="flex justify-center py-20">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
            </div>
        </div>
    </div>
</main>

<script>
    const token = localStorage.getItem('token');

    if(!token) window.location.href = '/login';

    async function loadUserInfo() {
        try {
            const res = await fetch('/api/auth/me/profile', { headers: { 'Authorization': 'Bearer ' + token } });
            if(res.ok) {
                const me = await res.json();
                document.getElementById('sidebar-user-name').textContent = me.prenom + ' ' + me.nom;
            }
        } catch (e) {
            console.error("Erreur profil", e);
        }
    }

    async function loadSoutenances() {
        const container = document.getElementById('soutenances-container');
        try {
            // Requête vers l'API gérant les dossiers de soutenance soumis au directeur
            const res = await fetch('/api/soutenance/directeur/mes-demandes', {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            // Si cette route exacte n'existe pas, ajuste l'URL d'appel ci-dessus
            const demandes = await res.json();
            document.getElementById('count-badge').textContent = `${demandes.length} Demande(s)`;

            container.innerHTML = '';

            if(demandes.length === 0) {
                container.innerHTML = `
                    <div class="glass-card p-20 text-center rounded-3xl border-dashed border-2 border-white/10">
                        <span class="material-symbols-outlined text-6xl text-slate-700 mb-4">inbox</span>
                        <h3 class="serif-display text-xl font-bold text-outline">Aucune demande de soutenance en attente</h3>
                    </div>`;
                return;
            }

            demandes.forEach(d => {
                const rapportUrl = `/api/soutenance/fichiers/${encodeURIComponent(d.rapportThesePath || '')}`;
                const plagiatUrl = `/api/soutenance/fichiers/${encodeURIComponent(d.rapportAntiPlagiatPath || '')}`;
                const pubUrl = `/api/soutenance/fichiers/${encodeURIComponent(d.rapportPublicationsCommunicationsPath || '')}`;

                container.innerHTML += `
                    <article class="bg-surface-container-low p-6 rounded-2xl border-l-4 border-primary grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

                        <!-- Section Gauche : Infos & Fichiers -->
                        <div class="lg:col-span-5 space-y-4">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center border border-primary/20">
                                    <span class="material-symbols-outlined text-primary text-2xl">school</span>
                                </div>
                                <div>
                                    <h3 class="serif-display text-xl font-bold text-white">${d.doctorant.prenom} ${d.doctorant.nom}</h3>
                                    <p class="text-xs text-outline uppercase tracking-wider font-semibold">Doctorant en cours de validation</p>
                                </div>
                            </div>

                            <hr class="border-white/5" />

                            <div class="space-y-2">
                                <h4 class="text-xs font-black uppercase tracking-widest text-primary mb-2">Pièces jointes requises</h4>
                                <button onclick="window.open('${rapportUrl}')" class="w-full text-left p-3 rounded-xl border border-white/5 bg-[#041329]/40 hover:bg-[#1c2a41] text-slate-300 hover:text-white transition-all flex items-center gap-3 text-sm">
                                    <span class="material-symbols-outlined text-primary text-sm">description</span> Rapport de Thèse
                                </button>
                                <button onclick="window.open('${plagiatUrl}')" class="w-full text-left p-3 rounded-xl border border-white/5 bg-[#041329]/40 hover:bg-[#1c2a41] text-slate-300 hover:text-white transition-all flex items-center gap-3 text-sm">
                                    <span class="material-symbols-outlined text-red-400 text-sm">verified_user</span> Rapport Anti-Plagiat
                                </button>
                                <button onclick="window.open('${pubUrl}')" class="w-full text-left p-3 rounded-xl border border-white/5 bg-[#041329]/40 hover:bg-[#1c2a41] text-slate-300 hover:text-white transition-all flex items-center gap-3 text-sm">
                                    <span class="material-symbols-outlined text-emerald-400 text-sm">analytics</span> Liste des publications
                                </button>
                            </div>
                        </div>

                        <!-- Section Droite : Formulaire Jury -->
                        <div class="lg:col-span-7 bg-[#010e24]/40 p-6 rounded-xl border border-white/5 space-y-4">
                            <h4 class="text-xs font-black uppercase tracking-widest text-primary flex items-center gap-2">
                                <span class="material-symbols-outlined text-sm">gavel</span> Définir la composition du jury
                            </h4>

                            <form id="form-jury-${d.id}" onsubmit="soumettreJuryPropose(event, ${d.id})" class="space-y-3">
                                <input type="text" class="w-full bg-surface-container-low border border-white/10 rounded-xl p-3 text-sm focus:border-primary outline-none transition-all text-white membre-input"
                                       placeholder="Ex: Pr. Nom Prénom (Rapporteur - Université de Rabat)" required>

                                <input type="text" class="w-full bg-surface-container-low border border-white/10 rounded-xl p-3 text-sm focus:border-primary outline-none transition-all text-white membre-input"
                                       placeholder="Ex: Pr. Nom Prénom (Examinateur - EMSI)" required>

                                <input type="text" class="w-full bg-surface-container-low border border-white/10 rounded-xl p-3 text-sm focus:border-primary outline-none transition-all text-white membre-input"
                                       placeholder="Ex: Pr. Nom Prénom (Président du Jury)" required>

                                <div class="text-end pt-2">
                                    <button type="submit" class="px-6 py-3 rounded-xl bg-primary text-on-primary font-bold hover:scale-[1.02] transition-all shadow-lg shadow-primary/10 uppercase text-xs tracking-widest">
                                        Transmettre le jury
                                    </button>
                                </div>
                            </form>
                        </div>
                    </article>
                `;
            });
        } catch (err) {
            container.innerHTML = '<p class="text-error text-center serif-display py-10">Erreur lors de la récupération des soutenances.</p>';
        }
    }

    async function soumettreJuryPropose(event, demandeId) {
        event.preventDefault();

        const inputElements = document.querySelectorAll(`#form-jury-${demandeId} .membre-input`);
        const membresSelectionnes = [];

        inputElements.forEach(input => {
            if (input.value.trim() !== "") {
                membresSelectionnes.push(input.value.trim());
            }
        });

        if (membresSelectionnes.length === 0) {
            alert("Veuillez renseigner au moins un membre du jury.");
            return;
        }

        try {
            const response = await fetch(`/api/soutenance/${demandeId}/proposer-jury`, {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(membresSelectionnes)
            });

            if (response.ok) {
                alert("La proposition de jury a bien été transmise à l'administration.");
                loadSoutenances();
            } else {
                const errorMsg = await response.text();
                alert("Erreur lors de la soumission du jury : " + errorMsg);
            }
        } catch (error) {
            console.error("Erreur technique :", error);
            alert("Impossible de joindre le serveur de validation.");
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = '/login';
    }

    // Initialisation synchrone avec le look & feel global
    loadUserInfo();
    loadSoutenances();
</script>
</body>
</html>
