<!DOCTYPE html>
<html class="dark" lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Mon Profil - Fiducia</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;1,600&family=Manrope:wght@400;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.symbols.outlined" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "#041329",
                        "primary": "#e9c176",
                        "surface-container": "#112036",
                        "on-surface": "#d6e3ff",
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #041329; color: #d6e3ff; font-family: 'Manrope', sans-serif; }
        .serif-title { font-family: 'Newsreader', serif; }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12">

<div class="max-w-4xl mx-auto">
    <header class="mb-10 flex justify-between items-center">
        <div>
            <h1 class="serif-title text-4xl font-bold text-primary">Mon Profil</h1>
            <p class="text-slate-400">Gérez vos informations personnelles</p>
        </div>
        <a id="backBtn" href="#" class="px-4 py-2 bg-white/5 hover:bg-white/10 rounded-lg text-sm transition-all border border-white/10">
            Retour au tableau de bord
        </a>
    </header>

    <div class="bg-surface-container rounded-2xl border border-white/5 shadow-2xl overflow-hidden">
        <div class="p-8 border-b border-white/5 bg-white/[0.02]">
            <div class="flex items-center gap-6">
                <div class="h-20 w-20 bg-primary/20 rounded-full flex items-center justify-center border-2 border-primary/30 shadow-lg">
                    <span id="userInitiale" class="serif-title text-4xl font-bold text-primary uppercase">
                        ?
                    </span>
                </div>
                <div>
                    <h2 id="displayFullname" class="text-2xl font-bold">Chargement...</h2>
                    <span id="displayRole" class="text-xs font-black uppercase tracking-widest bg-primary/10 text-primary px-2 py-1 rounded">ROLE</span>
                </div>
            </div>
        </div>

        <form id="profileForm" class="p-8 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-[10px] uppercase font-bold text-slate-500 tracking-widest px-1">Nom</label>
                    <input type="text" id="profNom" class="w-full bg-background border-white/10 rounded-xl text-sm focus:ring-primary focus:border-primary">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] uppercase font-bold text-slate-500 tracking-widest px-1">Prénom</label>
                    <input type="text" id="profPrenom" class="w-full bg-background border-white/10 rounded-xl text-sm focus:ring-primary focus:border-primary">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[10px] uppercase font-bold text-slate-500 tracking-widest px-1">Email (Identifiant)</label>
                <input type="email" id="profEmail" readonly class="w-full bg-white/5 border-none rounded-xl text-sm text-slate-500 cursor-not-allowed">
            </div>

            <div id="dynamicFields" class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-white/5">
            </div>

            <div class="pt-8">
                <button type="submit" class="w-full py-4 bg-primary text-[#412d00] font-bold rounded-xl hover:opacity-90 transition-all flex items-center justify-center gap-2">
                    Mettre à jour mon profil
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';

    async function loadProfile() {
        try {
            const res = await fetch('/api/auth/me/profile', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const user = await res.json();

            // --- LOGIQUE DE REDIRECTION DU BOUTON RETOUR ---
            const backBtn = document.getElementById('backBtn');
            const roles = user.roles.map(r => r.libelle);

            if (roles.includes('ROLE_ADMIN')) {
                backBtn.href = "/admin/dashboard";
            } else if (roles.includes('ROLE_CANDIDAT')) {
                backBtn.href = "/candidat/dashboard";
            } else if (roles.includes('ROLE_DIRECTEUR')) {
                backBtn.href = "/directeur/dashboard";
            }

            // 1. Affichage de l'initiale et du nom complet
            const initiale = user.prenom ? user.prenom.charAt(0) : '?';
            document.getElementById('userInitiale').textContent = initiale;
            document.getElementById('displayFullname').textContent = `${user.prenom} ${user.nom}`;

            // 2. Remplissage des champs de base
            document.getElementById('profNom').value = user.nom || '';
            document.getElementById('profPrenom').value = user.prenom || '';
            document.getElementById('profEmail').value = user.email || '';

            // 3. Affichage du rôle (Nettoyage du format ROLE_XXX)
            const roleCle = user.roles && user.roles.length > 0
                ? user.roles[0].libelle.replace('ROLE_', '')
                : 'UTILISATEUR';
            document.getElementById('displayRole').textContent = roleCle;

            const container = document.getElementById('dynamicFields');
            container.innerHTML = '';

            // 4. Logique Polymorphe (Affichage des données correspondantes)
            // On vérifie les champs spécifiques retournés par ton API

            if ("grade" in user) { // C'est un Directeur
                renderField(container, "Grade", "profGrade", user.grade);
                renderField(container, "Spécialité", "profSpecialite", user.specialite);
                renderField(container, "Laboratoire", "profLaboratoire", user.laboratoire, true);

                // Ajout manuel du HDR car c'est un checkbox, pas un texte
                const hdrDiv = document.createElement('div');
                hdrDiv.className = "md:col-span-2 flex items-center gap-3 p-4 bg-white/5 rounded-xl border border-white/5";
                hdrDiv.innerHTML = `
        <input type="checkbox" id="profHdr" ${user.habilitéDirigerRecherche ? 'checked' : ''}
               class="w-5 h-5 rounded border-white/10 bg-background text-primary focus:ring-primary">
        <label for="profHdr" class="text-sm font-bold text-slate-300">Habilité à Diriger des Recherches (HDR)</label>
    `;
                container.appendChild(hdrDiv);
            }
            else if ("service" in user) { // C'est un Administratif
                renderField(container, "Service", "profService", user.service);
                renderField(container, "Poste", "profPoste", user.poste);
            }
            else if ("totalCreditsCumules" in user) { // C'est un Candidat
                renderField(container, "Crédits Cumulés", "profCredits", user.totalCreditsCumules);
            }

        } catch (err) {
            console.error("Erreur lors du chargement du profil:", err);
            // Optionnel : rediriger vers login si le fetch échoue (token expiré)
            if(err.status === 401) window.location.href = '/login';
        }
    }

    function renderField(parent, label, id, value, fullWidth = false) {
        const div = document.createElement('div');
        if(fullWidth) div.className = "md:col-span-2 space-y-2";
        else div.className = "space-y-2";

        div.innerHTML = `
                <label class="text-[10px] uppercase font-bold text-primary tracking-widest px-1">${label}</label>
                <input type="text" id="${id}" value="${value || ''}" class="w-full bg-background border-white/10 rounded-xl text-sm focus:ring-primary focus:border-primary">
            `;
        parent.appendChild(div);
    }

    document.getElementById('profileForm').onsubmit = async (e) => {
        e.preventDefault();
        const updates = {
            nom: document.getElementById('profNom').value,
            prenom: document.getElementById('profPrenom').value
        };

        // Capture dynamique des champs injectés
        if(document.getElementById('profGrade')) updates.grade = document.getElementById('profGrade').value;
        if(document.getElementById('profSpecialite')) updates.specialite = document.getElementById('profSpecialite').value;
        if(document.getElementById('profLaboratoire')) updates.laboratoire = document.getElementById('profLaboratoire').value;
        if(document.getElementById('profService')) updates.service = document.getElementById('profService').value;
        if(document.getElementById('profPoste')) updates.poste = document.getElementById('profPoste').value;
        if(document.getElementById('profCredits')) updates.totalCreditsCumules = parseFloat(document.getElementById('profCredits').value);
        if(document.getElementById('profHdr')) {
            updates.habilitéDirigerRecherche = document.getElementById('profHdr').checked;
        }

        const res = await fetch('/api/auth/me/profile', {
            method: 'PUT',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(updates)
        });

        if(res.ok) alert("Profil mis à jour avec succès !");
    };

    window.onload = loadProfile;
</script>
</body>
</html>
