<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Connexion - Fiducia</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .message { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .back-link { text-align: center; margin-top: 1rem; }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Connexion</h2>

    <!-- ✅ FORM SPRING SECURITY STANDARD -->
    <form th:action="@{/login}" method="post">
        <input type="email" name="username" placeholder="Email" required>
        <input type="password" name="password" placeholder="Mot de passe" required>
        <button type="submit">Se connecter</button>
    </form>

    <!-- ✅ MESSAGES SPRING SECURITY -->
    <div th:if="${param.error}" class="message error">Email ou mot de passe incorrect</div>
    <div th:if="${param.logout}" class="message success">Déconnexion réussie</div>

    <a href="/" class="back-link">← Accueil</a>
</div>
</body>
</html>
