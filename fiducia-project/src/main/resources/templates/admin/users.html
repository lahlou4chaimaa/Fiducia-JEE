<div th:fragment="content">
    <table class="w-full text-left border-collapse">
        <thead>
        <tr class="bg-surface-container/30 border-b border-white/5 text-[10px] uppercase font-black text-slate-500 tracking-widest">
            <th class="px-8 py-5">Identité de l'Utilisateur</th>
            <th class="px-8 py-5">Entité / Type</th>
            <th class="px-8 py-5">Privilèges Actuels</th>
            <th class="px-8 py-5 text-right">Actions Habilitation</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-white/[0.03]">
        <tr th:each="user : ${users}" class="user-row hover:bg-white/[0.02] transition-all group">
            <td class="px-8 py-5">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-surface-bright flex items-center justify-center border border-white/5 text-primary text-xs font-bold"
                         th:text="${#strings.substring(user.nom,0,1)} + ${#strings.substring(user.prenom,0,1)}">
                    </div>
                    <div class="flex flex-col">
                        <span class="font-bold text-on-surface user-name group-hover:text-primary transition-colors" th:text="${user.nom} + ' ' + ${user.prenom}"></span>
                        <span class="text-[11px] text-slate-500 user-email font-mono" th:text="${user.email}"></span>
                    </div>
                </div>
            </td>

            <td class="px-8 py-5">
                <div th:if="${user instanceof T(com.example.fiducia.entities.CandidatDoctorant)}"
                     class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-white/5 text-slate-400 border border-white/10 text-[9px] font-black uppercase tracking-tighter">
                    <span class="material-symbols-outlined text-[12px]">school</span>
                    Candidat
                </div>
                <div th:if="${user instanceof T(com.example.fiducia.entities.DirecteurThese)}"
                     class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-primary/10 text-primary border border-primary/20 text-[9px] font-black uppercase tracking-tighter">
                    <span class="material-symbols-outlined text-[12px]">history_edu</span>
                    Directeur
                </div>
                <div th:if="${!(user instanceof T(com.example.fiducia.entities.CandidatDoctorant)) and !(user instanceof T(com.example.fiducia.entities.DirecteurThese))}"
                     class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-blue-500/10 text-blue-400 border border-blue-500/10 text-[9px] font-black uppercase tracking-tighter">
                    <span class="material-symbols-outlined text-[12px]">admin_panel_settings</span>
                    Personnel
                </div>
            </td>

            <td class="px-8 py-5">
                <div class="flex flex-wrap gap-1">
                        <span th:each="r : ${user.roles}"
                              class="inline-flex px-2 py-0.5 rounded text-[8px] font-black bg-primary/20 text-primary border border-primary/30 uppercase tracking-widest shadow-sm"
                              th:text="${r.libelle.replace('ROLE_', '')}"></span>
                </div>
            </td>

            <td class="px-8 py-5 text-right">
                <div class="flex justify-end items-center gap-2">
                    <div class="relative">
                        <select th:id="'select-role-' + ${user.id}"
                                class="appearance-none bg-surface-container border border-white/10 rounded-lg text-[10px] font-bold text-on-surface pl-3 pr-8 py-2 focus:ring-1 focus:ring-primary focus:border-primary cursor-pointer outline-none">
                            <option value="ROLE_CANDIDAT">CANDIDAT</option>
                            <option value="ROLE_DIRECTEUR">DIRECTEUR</option>
                            <option value="ROLE_ADMIN">ADMIN</option>
                        </select>
                        <span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-[12px] pointer-events-none text-slate-500">expand_more</span>
                    </div>

                    <button th:onclick="'handleRoleUpdate(' + ${user.id} + ', \'add\')'"
                            class="p-2 bg-green-500/10 text-green-400 rounded-lg hover:bg-green-500 hover:text-white transition-all shadow-lg shadow-green-500/5 group/btn"
                            title="Ajouter le rôle">
                        <span class="material-symbols-outlined text-sm block group-hover/btn:scale-110">add_moderator</span>
                    </button>

                    <button th:onclick="'handleRoleUpdate(' + ${user.id} + ', \'remove\')'"
                            class="p-2 bg-red-500/10 text-red-400 rounded-lg hover:bg-red-500 hover:text-white transition-all shadow-lg shadow-red-500/5 group/btn"
                            title="Retirer le rôle">
                        <span class="material-symbols-outlined text-sm block group-hover/btn:scale-110">remove_moderator</span>
                    </button>
                </div>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="4" class="px-8 py-20 text-center">
                <span class="material-symbols-outlined text-4xl text-slate-800 mb-2">person_search</span>
                <p class="text-slate-600 text-sm italic">Aucun utilisateur trouvé.</p>
            </td>
        </tr>
        </tbody>
    </table>
</div>
