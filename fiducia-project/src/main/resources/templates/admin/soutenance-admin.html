<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administration - Planification</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="mb-4">⚙️ Administration : Autorisation & Planification</h2>

    <div th:if="${#lists.isEmpty(demandesJuryProposes)}" class="alert alert-secondary">
        Aucun jury en attente de planification administrative.
    </div>

    <table th:if="${!#lists.isEmpty(demandesJuryProposes)}" class="table table-bordered table-striped bg-white shadow-sm align-middle">
        <thead class="table-dark">
        <tr>
            <th>Doctorant</th>
            <th>Directeur de Thèse</th>
            <th>Membres du Jury Proposés</th>
            <th>Planification & Autorisation Finale</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="demande : ${demandesJuryProposes}">
            <td><strong th:text="${demande.doctorant.nom} + ' ' + ${demande.doctorant.prenom}"></strong></td>
            <td th:text="${demande.directeur.nom} + ' ' + ${demande.directeur.prenom}"></td>
            <td>
                <ul class="mb-0 ps-3">
                    <li th:each="membre : ${demande.membresJuryProposes}" th:text="${membre}"></li>
                </ul>
            </td>
            <td>
                <!-- Modification ici : Ajout d'un ID dynamique et appel de la fonction JS au submit -->
                <form th:id="'form-planif-' + ${demande.id}" th:onsubmit="'planifierSoutenance(event, ' + ${demande.id} + ')'" class="row g-2">
                    <div class="col-12">
                        <label class="small fw-bold">Date de soutenance :</label>
                        <!-- Suppression des attributs "name" pour ne pas interférer, ajout de classes d'identification -->
                        <input type="datetime-local" class="form-control form-control-sm date-in" required>
                    </div>
                    <div class="col-6">
                        <label class="small fw-bold">Heure :</label>
                        <input type="text" class="form-control form-control-sm heure-in" placeholder="ex: 10:00" required>
                    </div>
                    <div class="col-6">
                        <label class="small fw-bold">Lieu / Salle :</label>
                        <input type="text" class="form-control form-control-sm lieu-in" placeholder="ex: Amphi A" required>
                    </div>
                    <div class="col-12 text-end mt-2">
                        <button type="submit" class="btn btn-success btn-sm w-100">Autoriser et Planifier (via API)</button>
                    </div>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Injection du script JavaScript pour communiquer en JSON pur avec le RestController -->
<script>
    function planifierSoutenance(event, demandeId) {
        event.preventDefault(); // Empêche la page de se recharger automatiquement

        // Cibler les champs spécifiques à la ligne du tableau via l'ID du formulaire parent
        const dateInput = document.querySelector(`#form-planif-${demandeId} .date-in`).value;
        const heureInput = document.querySelector(`#form-planif-${demandeId} .heure-in`).value;
        const lieuInput = document.querySelector(`#form-planif-${demandeId} .lieu-in`).value;

        // Construction du payload DTO attendu par ton @RequestBody (le format LocalDateTime requiert les secondes :SS)
        const payload = {
            date: dateInput + ":00",
            heure: heureInput,
            lieu: lieuInput
        };

        // Envoi de la requête asynchrone vers ton API existante
        fetch(`/api/soutenance/${demandeId}/autoriser-et-planifier`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        })
            .then(response => {
                if (response.ok) {
                    alert("Soutenance validée, planifiée et enregistrée avec succès !");
                    window.location.reload(); // Recharge la vue pour mettre à jour le tableau
                } else {
                    response.text().then(errorMessage => {
                        alert("Erreur lors de la planification : " + errorMessage);
                    });
                }
            })
            .catch(error => {
                console.error("Erreur technique lors de l'appel API :", error);
                alert("Impossible de joindre le serveur de planification.");
            });
    }
</script>
</body>
</html>
