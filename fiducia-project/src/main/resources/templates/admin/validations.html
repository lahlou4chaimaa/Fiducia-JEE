<div th:fragment="content">
    <div class="grid gap-8">
        <article th:each="d : ${dossiersEnAttente}"
                 class="bg-surface-container-low p-8 rounded-xl relative group transition-all hover:bg-surface-container-high border-l-4 border-primary">

            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8">
                <div class="flex items-center gap-5">
                    <div class="w-14 h-14 rounded-full bg-primary/10 flex items-center justify-center border border-primary/20">
                        <span class="material-symbols-outlined text-primary text-3xl font-light">account_circle</span>
                    </div>
                    <div>
                        <div class="flex items-center gap-3 mb-1">
                            <h3 class="serif-display text-2xl font-bold text-white" th:text="${d.candidat.nom} + ' ' + ${d.candidat.prenom}"></h3>
                            <span class="text-[9px] px-2 py-0.5 rounded bg-primary text-on-primary font-black uppercase tracking-tighter">Prêt pour décision</span>
                        </div>
                        <p class="text-sm text-outline font-medium italic" th:text="${d.sujetThèse}"></p>
                    </div>
                </div>

                <div class="text-right flex flex-col items-end gap-1">
                    <p class="text-[10px] text-outline font-mono uppercase tracking-widest" th:text="${#temporals.format(d.dateDerniereModification, 'dd/MM/yyyy HH:mm')}"></p>
                    <span class="px-3 py-1 bg-primary/10 border border-primary/20 rounded-full text-primary text-[9px] uppercase font-black tracking-widest" th:text="${d.laboratoire}"></span>
                </div>
            </div>

            <div class="bg-white/[0.03] p-6 rounded-xl mb-8 border border-white/5 relative overflow-hidden">
                <div class="absolute top-0 right-0 p-2 opacity-10">
                    <span class="material-symbols-outlined text-4xl text-primary">format_quote</span>
                </div>
                <div class="flex items-center gap-2 mb-3">
                    <span class="material-symbols-outlined text-primary text-lg">comment</span>
                    <p class="text-[10px] uppercase font-black text-slate-500 tracking-widest">Avis du Directeur de Thèse</p>
                </div>
                <p class="text-sm italic text-slate-200 leading-relaxed relative z-10"
                   th:text="${d.commentaireDirecteur ?: 'Le directeur n''a pas laissé de commentaire spécifique.'}"></p>
            </div>

            <div class="flex flex-wrap justify-between items-center pt-6 border-t border-white/5 gap-4">
                <div class="flex gap-2">
                    <button th:data-path="${d.cvPath}" onclick="openFile(this)"
                            class="flex items-center gap-2 px-3 py-2 border border-white/10 text-outline rounded-lg hover:text-primary hover:border-primary/30 transition-all text-[10px] font-bold uppercase tracking-tighter group/btn">
                        <span class="material-symbols-outlined text-sm group-hover/btn:scale-110">description</span> CV
                    </button>
                    <button th:data-path="${d.diplomePath}" onclick="openFile(this)"
                            class="flex items-center gap-2 px-3 py-2 border border-white/10 text-outline rounded-lg hover:text-primary hover:border-primary/30 transition-all text-[10px] font-bold uppercase tracking-tighter group/btn">
                        <span class="material-symbols-outlined text-sm group-hover/btn:scale-110">school</span> Diplôme
                    </button>
                    <button th:data-path="${d.lettreMotivationPath}" onclick="openFile(this)"
                            class="flex items-center gap-2 px-3 py-2 border border-white/10 text-outline rounded-lg hover:text-primary hover:border-primary/30 transition-all text-[10px] font-bold uppercase tracking-tighter group/btn">
                        <span class="material-symbols-outlined text-sm group-hover/btn:scale-110">mail</span> Motivation
                    </button>
                </div>

                <button th:data-id="${d.id}" th:onclick="'openFinalModal(' + ${d.id} + ')'"
                        class="px-8 py-3 bg-primary text-on-primary font-black rounded-xl text-[11px] uppercase tracking-widest hover:scale-[1.03] active:scale-95 transition-all shadow-lg shadow-primary/10">
                    Statuer sur l'inscription
                </button>
            </div>
        </article>

        <div th:if="${#lists.isEmpty(dossiersEnAttente)}"
             class="py-32 text-center bg-surface-container-low/50 rounded-3xl border-2 border-dashed border-white/5">
            <div class="w-20 h-20 bg-white/5 rounded-full flex items-center justify-center mx-auto mb-6">
                <span class="material-symbols-outlined text-4xl text-slate-600">verified_user</span>
            </div>
            <h3 class="serif-display text-2xl font-bold text-slate-400">File d'attente vide</h3>
            <p class="text-sm text-slate-600 mt-2 font-body italic">Tous les dossiers avec avis directeur ont été traités.</p>
        </div>
    </div>
</div>
