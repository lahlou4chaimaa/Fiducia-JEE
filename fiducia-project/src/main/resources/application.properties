spring.application.name=fiducia
# Permet a Hibernate de creer les tables user_roles, utilisateur, role, etc.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=true

# Configuration de la Base de Données
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuration JWT
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_EXPIRATION_MS}
# Autoriser jusqu'à 10MB par fichier
spring.servlet.multipart.max-file-size=10MB
# Autoriser jusqu'à 30MB pour l'ensemble de la requête (tous les fichiers cumulés)
spring.servlet.multipart.max-request-size=30MB
# For Patch Delete ...
spring.mvc.hiddenmethod.filter.enabled=true