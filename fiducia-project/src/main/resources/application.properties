spring.application.name=fiducia
# Permet à Hibernate de créer les tables user_roles, utilisateur, role, etc.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5432/doctorat_db
spring.datasource.username=postgres
spring.datasource.password=megustacolombiana

# Configuration JWT
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_EXPIRATION_MS}
# Autoriser jusqu'à 10MB par fichier
spring.servlet.multipart.max-file-size=10MB
# Autoriser jusqu'à 30MB pour l'ensemble de la requête (tous les fichiers cumulés)
spring.servlet.multipart.max-request-size=30MB