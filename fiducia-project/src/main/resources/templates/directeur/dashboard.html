<!DOCTYPE html>
<html class="dark" lang="fr">
<head>
    <meta charset="utf-8"/>
    <title>Espace Directeur - Fiducia</title>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Manrope:wght@200..800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e9c176",
                        "on-primary": "#412d00",
                        "background": "#041329",
                        "surface-container-low": "#0d1c32",
                        "surface-container-high": "#1c2a41",
                        "outline": "#8f9097",
                        "error": "#ffb4ab"
                    },
                    fontFamily: {
                        "serif": ["Newsreader", "serif"],
                        "body": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #041329;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            background-attachment: fixed;
            font-family: 'Manrope', sans-serif;
        }
        .serif-display { font-family: 'Newsreader', serif; }
        .glass-card { background: rgba(17, 32, 54, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="text-on-surface">

<nav class="fixed top-0 w-full z-50 bg-[#041329]/80 border-b border-white/10 backdrop-blur-md flex justify-between items-center px-6 h-16">
    <div class="flex items-center gap-4">
        <span class="serif-display text-xl tracking-tight text-primary font-bold italic">Fiducia</span>
    </div>
</nav>

<aside class="fixed left-0 top-16 h-[calc(100vh-64px)] w-64 z-40 bg-[#010e24] flex flex-col py-8 border-r border-white/5 hidden md:flex">
    <nav class="flex-1">
        <ul class="space-y-1">
            <li>
                <a class="flex items-center gap-4 py-3 px-6 border-l-4 border-primary bg-white/5 text-primary font-bold text-sm tracking-wide uppercase" href="/directeur/dashboard">
                    <span class="material-symbols-outlined">folder_shared</span> Candidatures
                </a>
            </li>
            <li>
                <!-- AJOUT : Navigation fluide vers l'interface de proposition des jurys de soutenance -->
                <a class="flex items-center gap-4 py-3 px-6 border-l-4 border-transparent text-slate-400 hover:bg-white/5 hover:text-white text-sm tracking-wide uppercase transition-all" href="/directeur/soutenances">
                    <span class="material-symbols-outlined">gavel</span> Jurys Soutenance
                </a>
            </li>
        </ul>
    </nav>

    <div class="px-4 pt-4 border-t border-white/5 space-y-4">
        <div class="flex items-center gap-2">
            <a href="/profile" class="flex-1 flex items-center gap-3 p-2 rounded-xl bg-[#112036] border border-white/5 hover:bg-[#2c3951] transition-all group">
                <div class="h-8 w-8 rounded-full bg-primary/20 flex items-center justify-center border border-primary/30">
                    <span class="material-symbols-outlined text-primary text-sm">person</span>
                </div>
                <div class="flex flex-col min-w-0">
                    <span id="sidebar-user-name" class="text-[11px] font-bold truncate">Mon Profil</span>
                    <span class="text-[9px] text-slate-500 uppercase tracking-tighter">Directeur</span>
                </div>
            </a>

            <button onclick="logout()" class="p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 hover:bg-red-500 hover:text-white transition-all group" title="Déconnexion">
                <span class="material-symbols-outlined text-sm">logout</span>
            </button>
        </div>
    </div>
</aside>

<main class="md:ml-64 pt-24 px-6 pb-12 lg:px-12">
    <div class="max-w-7xl mx-auto">
        <header class="mb-12 relative">
            <div class="absolute -top-12 -left-12 w-64 h-64 bg-primary/10 rounded-full blur-[80px] pointer-events-none"></div>
            <div class="flex justify-between items-end relative z-10">
                <div>
                    <h1 class="serif-display text-5xl font-extrabold text-primary tracking-tight mb-2">Gestion des Candidatures</h1>
                    <p class="text-outline max-w-2xl text-lg italic">Consultez et donnez votre avis sur les nouveaux dossiers de thèse.</p>
                </div>
                <div id="count-badge" class="px-4 py-2 bg-primary/10 border border-primary/20 rounded-full text-primary text-[10px] uppercase font-black tracking-widest">
                    0 Dossier(s)
                </div>
            </div>
        </header>

        <div id="dossiers-container" class="space-y-6">
            <div class="flex justify-center py-20">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
            </div>
        </div>
    </div>
</main>

<div id="modal-avis" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-lg p-8 rounded-3xl shadow-2xl border border-white/10 relative">
        <h3 class="serif-display text-2xl font-bold text-primary mb-2">Évaluation du dossier</h3>
        <p class="text-xs text-outline mb-6 font-medium">Votre décision sera transmise à l'administration.</p>

        <textarea id="comm-directeur" placeholder="Commentaires (Optionnel)..."
                  class="w-full bg-surface-container-low border border-white/10 rounded-xl p-4 text-sm mb-8 h-32 focus:border-primary outline-none transition-all text-white"></textarea>

        <div class="flex gap-4">
            <button onclick="validerAvis(false)" class="flex-1 py-4 rounded-xl border border-red-500/50 text-red-400 font-bold hover:bg-red-500/10 transition-all uppercase text-xs tracking-widest">
                Défavorable
            </button>
            <button onclick="validerAvis(true)" class="flex-1 py-4 rounded-xl bg-primary text-on-primary font-bold hover:scale-[1.02] transition-all shadow-lg shadow-primary/20 uppercase text-xs tracking-widest">
                Favorable
            </button>
        </div>
        <button onclick="closeModal()" class="w-full mt-6 text-[10px] uppercase tracking-widest text-outline hover:text-white transition-all">Annuler</button>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    let selectedDossierId = null;

    if(!token) window.location.href = '/login';

    async function loadUserInfo() {
        try {
            const res = await fetch('/api/auth/me/profile', { headers: { 'Authorization': 'Bearer ' + token } });
            if(res.ok) {
                const me = await res.json();
                document.getElementById('sidebar-user-name').textContent = me.prenom + ' ' + me.nom;
            }
        } catch (e) {
            console.error("Erreur profil", e);
        }
    }

    async function loadDossiers() {
        const container = document.getElementById('dossiers-container');
        try {
            const res = await fetch('/api/validation/directeur/mes-dossiers', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const dossiers = await res.json();
            document.getElementById('count-badge').textContent = `${dossiers.length} Dossier(s)`;

            container.innerHTML = '';

            if(dossiers.length === 0) {
                container.innerHTML = `
                    <div class="glass-card p-20 text-center rounded-3xl border-dashed border-2 border-white/10">
                        <span class="material-symbols-outlined text-6xl text-slate-700 mb-4">inbox</span>
                        <h3 class="serif-display text-xl font-bold text-outline">Aucun dossier en attente</h3>
                    </div>`;
                return;
            }

            dossiers.forEach(d => {
                const dateModif = new Date(d.dateDerniereModification).toLocaleDateString('fr-FR');

                // Sécurisation des chaînes de chemins de fichiers pour l'injection JS
                const cvUrl = `/api/soutenance/fichiers/${encodeURIComponent(d.cvPath || '')}`;
                const lmUrl = `/api/soutenance/fichiers/${encodeURIComponent(d.lettreMotivationPath || '')}`;

                container.innerHTML += `
                    <article class="bg-surface-container-low p-6 rounded-xl relative group transition-all hover:bg-surface-container-high border-l-4 border-primary">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                            <div class="flex items-center gap-5">
                                <div class="w-14 h-14 rounded-full bg-primary/10 flex items-center justify-center border border-primary/20">
                                     <span class="material-symbols-outlined text-primary text-3xl font-light">account_circle</span>
                                </div>
                                <div>
                                    <h3 class="serif-display text-xl font-bold text-white">${d.candidat.prenom} ${d.candidat.nom}</h3>
                                    <p class="text-sm text-outline font-medium">Sujet : "${d.sujetThèse}"</p>
                                </div>
                            </div>
                            <div class="flex flex-col items-end gap-2">
                                <span class="text-[10px] font-bold uppercase tracking-widest text-primary bg-primary/10 px-2 py-0.5 rounded">En attente d'avis</span>
                                <p class="text-xs text-outline italic font-mono uppercase">Reçu le ${dateModif}</p>
                            </div>
                        </div>

                        <div class="mt-6 flex flex-wrap gap-3">
                            <button onclick="openModal(${d.id})" class="flex items-center gap-2 px-6 py-2 bg-primary text-on-primary rounded-lg text-sm font-bold transition-all hover:brightness-110">
                                <span class="material-symbols-outlined text-sm">rate_review</span> Évaluer la candidature
                            </button>
                            <div class="flex gap-2">
                                <button onclick="window.open('${cvUrl}')" class="p-2 border border-white/10 text-outline rounded-lg hover:text-primary transition-all flex items-center gap-2 text-xs font-bold uppercase tracking-tighter">
                                    <span class="material-symbols-outlined text-sm">description</span> CV
                                </button>
                                <button onclick="window.open('${lmUrl}')" class="p-2 border border-white/10 text-outline rounded-lg hover:text-primary transition-all flex items-center gap-2 text-xs font-bold uppercase tracking-tighter">
                                    <span class="material-symbols-outlined text-sm">mail</span> Lettre
                                </button>
                            </div>
                        </div>
                    </article>
                `;
            });
        } catch (err) {
            container.innerHTML = '<p class="text-error text-center serif-display">Erreur lors de la récupération des dossiers candidates.</p>';
        }
    }

    function openModal(id) {
        selectedDossierId = id;
        document.getElementById('comm-directeur').value = '';
        document.getElementById('modal-avis').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('modal-avis').classList.add('hidden');
    }

    async function validerAvis(favorable) {
        const comm = document.getElementById('comm-directeur').value;
        try {
            const res = await fetch(`/api/validation/directeur/${selectedDossierId}/avis`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ valide: favorable, commentaires: comm })
            });
            if(res.ok) {
                closeModal();
                loadDossiers();
            } else {
                alert("Impossible d'enregistrer votre décision.");
            }
        } catch (err) {
            alert("Erreur réseau lors de la validation.");
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = '/login';
    }

    // Initialisation
    loadUserInfo();
    loadDossiers();
</script>
</body>
</html>
