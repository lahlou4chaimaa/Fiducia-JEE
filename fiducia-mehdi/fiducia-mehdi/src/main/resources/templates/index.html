<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fiducia</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-primary {
            background: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background: #0056b3;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background: #545b62;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h1>🚀 Fiducia</h1>
    <p style="color: #666; margin-bottom: 2rem;">Bienvenue</p>

    <a href="/login" class="btn btn-secondary">🔐 Se connecter</a>
    <a href="/register" class="btn btn-primary">✨ S'inscrire</a>
    <script>
        if (localStorage.getItem('token')) {
            fetch('/admin', {
                headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
            })
                .then(res => {
                    if (res.ok) window.location.href = '/admin';  // ✅ SUPER_ADMIN → admin
                })
                .catch(() => { /* Token invalide → reste index */ });
        }
    </script>

</div>
</body>
</html>
